[package]
name = "weft-gui"
version = "0.1.0"
edition = "2024"
description = "Weft — local-first Markdown vault editor"
publish = false

[lints]
workspace = true

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
weft-core = { path = "../weft-core" }
egui = { version = "0.29", features = ["accesskit", "persistence"] }
eframe = { version = "0.29", features = ["persistence", "accesskit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui_commonmark = "0.18"
egui_extras = "0.29"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
