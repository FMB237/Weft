[package]
name = "editor-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
egui = { version = "0.29" }  # For Pos2 type sharing
petgraph = { version = "0.6", features = ["serde", "graphmap"] }
slotmap = "1.0"
comrak = { version = "0.20", features = ["default"] }
pulldown-cmark = { version = "0.10", features = ["simd"] }
notify = { version = "6", features = ["mio"] }
walkdir = "2"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
chrono = "0.4"
tantivy = "0.21"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tempfile = "3"
