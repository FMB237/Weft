[package]
name = "editor-gui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "editor-gui"
path = "src/main.rs"

[dependencies]
editor-core = { path = "../editor-core" }
egui = { version = "0.29", features = ["accesskit", "persistence"] }
eframe = { version = "0.29", features = ["persistence", "accesskit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui_commonmark = "0.18"

[dev-dependencies]
tempfile = "3"
