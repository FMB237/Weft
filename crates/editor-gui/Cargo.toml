[package]
name = "editor-gui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[[bin]]
name = "editor-gui"
path = "src/main.rs"

[dependencies]
editor-core = { path = "../editor-core" }
egui = { version = "0.29", features = ["accesskit", "persistence"] }
eframe = { version = "0.29", features = ["persistence", "accesskit"] }
image = { version = "0.24", features = ["png", "jpeg", "gif", "webp"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
parking_lot = "0.12"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
