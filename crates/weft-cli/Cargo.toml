[package]
name = "weft-cli"
version = "0.1.0"
edition = "2024"
description = "Weft — command-line access to a Markdown vault"
publish = false

[[bin]]
name = "weft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
weft-core = { path = "../weft-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
