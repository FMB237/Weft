[workspace]
members = [
    "crates/weft-core",
    "crates/weft-gui",
    "crates/weft-cli",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["bruce"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
# Public API documentation is tracked in M3 of PLAN.md. Re-enable this lint
# once the core API stabilizes so it does not drown out real warnings.
missing_docs = "allow"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
# Doc-section lints are part of the M3 documentation pass in PLAN.md.
missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

# These enums are internal and intentionally exhaustive.
exhaustive_enums = "allow"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Numeric conversions are explicit and bounded in the graph/layout math.
as_conversions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
